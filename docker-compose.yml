version: '3.9'

# ==================================================
# AI Content Factory — Docker Compose
# Start everything: docker compose up --build -d
# ==================================================

services:
  # ─────────────────────────────────────────
  # PostgreSQL
  # ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: acf_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - acf_network

  # ─────────────────────────────────────────
  # Redis
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: acf_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - acf_network

  # ─────────────────────────────────────────
  # MinIO (S3-Compatible Object Storage)
  # ─────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: acf_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - acf_network

  # ─────────────────────────────────────────
  # MinIO Bucket Init (one-shot job)
  # ─────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: acf_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY} &&
        mc mb --ignore-existing local/${MINIO_BUCKET} &&
        mc anonymous set download local/${MINIO_BUCKET}/public &&
        echo 'MinIO bucket initialized.'
      "
    networks:
      - acf_network

  # ─────────────────────────────────────────
  # NestJS API
  # ─────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: acf_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    volumes:
      - ./apps/api:/app/apps/api:delegated
      - /app/apps/api/node_modules
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - acf_network
    labels:
      - "traefik.enable=false"

  # ─────────────────────────────────────────
  # Next.js Web App
  # ─────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    container_name: acf_web
    restart: unless-stopped
    depends_on:
      - api
    env_file: .env
    volumes:
      - ./apps/web:/app/apps/web:delegated
      - /app/apps/web/node_modules
      - /app/apps/web/.next
    networks:
      - acf_network

  # ─────────────────────────────────────────
  # BullMQ Workers (all pipeline stages)
  # ─────────────────────────────────────────
  worker-research:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    container_name: acf_worker_research
    restart: unless-stopped
    command: ["node", "dist/workers/research/main.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    networks:
      - acf_network

  worker-script:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    container_name: acf_worker_script
    restart: unless-stopped
    command: ["node", "dist/workers/script/main.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    networks:
      - acf_network

  worker-voice:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    container_name: acf_worker_voice
    restart: unless-stopped
    command: ["node", "dist/workers/voice/main.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    networks:
      - acf_network

  worker-image:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    container_name: acf_worker_image
    restart: unless-stopped
    command: ["node", "dist/workers/image/main.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    networks:
      - acf_network

  worker-video:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    container_name: acf_worker_video
    restart: unless-stopped
    command: ["node", "dist/workers/video/main.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    volumes:
      - render_cache:/tmp/renders
    networks:
      - acf_network

  worker-thumbnail:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    container_name: acf_worker_thumbnail
    restart: unless-stopped
    command: ["node", "dist/workers/thumbnail/main.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    networks:
      - acf_network

  worker-upload:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    container_name: acf_worker_upload
    restart: unless-stopped
    command: ["node", "dist/workers/upload/main.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    networks:
      - acf_network

  worker-analytics:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    container_name: acf_worker_analytics
    restart: unless-stopped
    command: ["node", "dist/workers/analytics/main.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    networks:
      - acf_network

  # ─────────────────────────────────────────
  # Nginx Reverse Proxy
  # ─────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: acf_nginx
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_logs:/var/log/nginx
      - certbot_webroot:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - acf_network

# ─────────────────────────────────────────
# Volumes
# ─────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  render_cache:
    driver: local
  nginx_logs:
    driver: local
  certbot_webroot:
    driver: local
  certbot_certs:
    driver: local

# ─────────────────────────────────────────
# Networks
# ─────────────────────────────────────────
networks:
  acf_network:
    driver: bridge
