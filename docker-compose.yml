# ==================================================
# AI Content Factory — Dokploy Production Compose
# Start everything: docker compose up --build -d
# ==================================================

services:
  # ─────────────────────────────────────────
  # PostgreSQL Database
  # ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-acf_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acf_password}
      POSTGRES_DB: ${POSTGRES_DB:-acf_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-acf_user} -d ${POSTGRES_DB:-acf_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - acf_network

  # ─────────────────────────────────────────
  # Redis Queue & Cache
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - acf_network

  # ─────────────────────────────────────────
  # MinIO (S3 Object Storage)
  # ─────────────────────────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-acf_minio_access}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-acf_minio_secret_key_12345}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - acf_network

  # ─────────────────────────────────────────
  # MinIO Bucket Init (One-shot Setup)
  # ─────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-acf_minio_access} ${MINIO_SECRET_KEY:-acf_minio_secret_key_12345} &&
        mc mb --ignore-existing local/${MINIO_BUCKET:-acf-assets} &&
        mc anonymous set download local/${MINIO_BUCKET:-acf-assets}/public || true &&
        echo 'MinIO bucket initialized.'
      "
    networks:
      - acf_network

  # ─────────────────────────────────────────
  # NestJS API Engine
  # ─────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://acf_user:acf_password@postgres:5432/acf_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:-f9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8}
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET:-e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855}
      APP_URL: ${APP_URL:-https://youtub-auto-5opxww-7caa24-169-58-142-29.sslip.io}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      YOUTUBE_REDIRECT_URI: ${YOUTUBE_REDIRECT_URI:-https://youtub-auto-5opxww-7caa24-169-58-142-29.sslip.io/api/channels/oauth/youtube/callback}
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - acf_network

  # ─────────────────────────────────────────
  # Next.js Web App Studio
  # ─────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_API_URL: "/api"
      INTERNAL_API_URL: "http://api:3001/api"
    ports:
      - "3002:3000"
    networks:
      - acf_network

  # ─────────────────────────────────────────
  # Unified Pipeline Worker
  # ─────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    restart: unless-stopped
    command: ["node", "dist/unified.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://acf_user:acf_password@postgres:5432/acf_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    volumes:
      - render_cache:/tmp/renders
    networks:
      - acf_network

# ─────────────────────────────────────────
# Persistent Storage Volumes
# ─────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  render_cache:
    driver: local

# ─────────────────────────────────────────
# Networks
# ─────────────────────────────────────────
networks:
  acf_network:
    driver: bridge
